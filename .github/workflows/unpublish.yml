name: Unpublish

# 一次性维护入口：把某个版本从 registry 撤下。撤下的版本无法再被安装，
# 因此只接受显式 dispatch 与精确版本号，不做任何自动触发。
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to remove, for example 0.2.28
        required: true
        type: string

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Refuse anything that is not a plain version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$VERSION" in
            ''|*[!0-9.]*) echo "not a plain version: $VERSION"; exit 1 ;;
          esac
          echo "removing dsh-pwsh-plugin@$VERSION"
      - name: Remove the version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: npm unpublish "dsh-pwsh-plugin@$VERSION" --force
      - name: Report what the registry serves now
        run: |
          npm view dsh-pwsh-plugin versions --json || true
          npm view dsh-pwsh-plugin dist-tags --json || true